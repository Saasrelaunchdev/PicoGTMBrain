# Copy to .github/workflows/brain-lint.yml in the Pico product repository.
# Lints every changed copy file against the Pico GTM brain, checked out as the gtm-brain submodule.
name: brain-lint
on:
  pull_request:
    paths: ["**/*.md", "**/locales/**", "**/i18n/**", "**/emails/**", "**/*.liquid"]
jobs:
  lint-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint changed copy against the brain
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.md' '*locales*' '*i18n*' '*emails*' '*.liquid' \
            | grep -v '^gtm-brain/' | while read -r f; do
              [ -f "$f" ] && python3 gtm-brain/tools/brain.py lint "$f" || exit 1
            done
